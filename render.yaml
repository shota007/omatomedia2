# render.yaml
databases:
  - name: omatomedia-db
    plan: free
    region: singapore

services:
  - type: web
    name: omatomedia
    runtime: ruby
    plan: free
    region: singapore

    # ビルド/起動
    buildCommand: bundle install && bundle exec rake assets:precompile
    # Free プランは preDeployCommand が使えないため、起動時に migrate してから puma を起動する
    # （毎回実行されても安全）
    startCommand: bundle exec rails db:migrate && bundle exec puma -t 5:5 -p ${PORT:-3000} -e ${RACK_ENV:-production}

    # 健康チェック
    healthCheckPath: "/"

    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production

      # Rails の secret_key_base は Render に生成してもらう
      - key: SECRET_KEY_BASE
        generateValue: true

      # Render の DB 接続文字列を DATABASE_URL に流し込む
      - key: DATABASE_URL
        fromDatabase:
          name: omatomedia-db
          property: connectionString

      # 記事生成（Claude）/ YouTube検索。値は Render のダッシュボードで設定する
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_API_KEY
        sync: false

      # 既存機能で使うもの（値はダッシュボードで設定する）
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
